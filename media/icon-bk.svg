<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110">
  <defs>
    <!-- badge bodies: lit from above -->
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11736d"/><stop offset="1" stop-color="#064a46"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2bb5a9"/><stop offset=".55" stop-color="#0d817a"/><stop offset="1" stop-color="#0a6c66"/></linearGradient>
    <!-- soft top gloss (no hard glass split, which dates an icon) -->
    <radialGradient id="gloss" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <!-- 1px rim: light on top, dark at the bottom -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9f2ef"/></linearGradient>
    <!-- drop shadow from basic primitives: feDropShadow is unsupported in some renderers -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/><feOffset dy="2" result="s"/><feFlood flood-color="#032a28" flood-opacity=".35"/><feComposite in2="s" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="face"><circle cx="73" cy="64" r="46"/></clipPath>
    <!-- back badge: cut out a ring around the front badge so the overlap reads on any background -->
    <mask id="cut"><rect width="128" height="128" fill="#fff"/><circle cx="73" cy="64" r="50"/></mask>
  </defs>
  <!-- drawn on a 128 grid; shift it so the cropped canvas starts at 0 0 -->
  <g transform="translate(-9 -9)">
    <g filter="url(#drop)">
      <circle cx="55" cy="64" r="46" fill="url(#back)" mask="url(#cut)"/>
      <circle cx="73" cy="64" r="46" fill="url(#front)"/>
    </g>
    <ellipse cx="73" cy="30" rx="40" ry="26" fill="url(#gloss)" clip-path="url(#face)"/>
    <circle cx="73" cy="64" r="45.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
    <!-- glyphs as in sign.svg, raised by a short shadow -->
    <g fill="url(#glyph)" filter="url(#drop)">
      <path d="M44 74l21 21 39-39" fill="none" stroke="url(#glyph)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M64 24h18v25h13l-22 22-22-22h13z"/>
    </g>
  </g>
</svg>
